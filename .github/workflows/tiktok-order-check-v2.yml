# Pengecekan pesanan TikTok otomatis tiap 5 menit (24 jam) — pemicu cadangan
# saat tidak ada tab admin Hub yang terbuka (tick dalam aplikasi hanya jalan
# selama halaman Hub dibuka; cron Vercel hanya sekali sehari).
#
# Endpoint idempoten — tabel tiktok_order_seen mencegah kirim ganda.
# Rahasia CRON_SECRET disimpan di repo: Settings → Secrets and variables →
# Actions → New repository secret (nilai sama dengan env CRON_SECRET Vercel).
#
# Catatan 2026-10-06: file ini dibuat ulang dengan nama -v2 karena
# pendaftaran jadwal file lama di GitHub macet (updated_at mentok di
# 2026-10-05 dan tidak menghasilkan run baru meski cron */5 dan file
# sudah diperbarui). Nama file baru memaksa GitHub mendaftarkan jadwal
# baru dari nol. Selain itu langkah kini fail-fast bila endpoint menjawab
# non-2xx (mis. 401 karena secret keliru) dan mencoba ulang 3 kali dengan
# jeda 10 detik untuk gangguan jaringan sementara.
name: TikTok order check v2

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil endpoint cek pesanan TikTok
        run: |
          curl -sS -f --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://admin.kustoro2026.com/api/tiktok/resi/check
